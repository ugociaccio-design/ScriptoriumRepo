<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor a Blocchi per Scrittori</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --border: #d0d0d0;
            --primary: #3b6caa;
            --text: #1f1f1f;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: var(--primary);
            color: white;
            padding: 1.5rem 2rem;
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }

        header p {
            margin: 0;
            max-width: 720px;
        }

        main {
            padding: 2rem;
            max-width: 960px;
            margin: 0 auto;
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        button, input, textarea {
            font: inherit;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        #blocks {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .block {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.25rem;
            box-shadow: 0 8px 18px rgba(31, 31, 31, 0.08);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .block[aria-grabbed="true"] {
            opacity: 0.6;
        }

        .block-header {
            display: grid;
            grid-template-columns: auto 1fr 1fr auto;
            gap: 0.75rem;
            align-items: center;
        }

        .block-header input[type="text"],
        .block-header input[type="search"] {
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .drag-handle {
            cursor: grab;
            user-select: none;
            font-size: 1.2rem;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .toolbar button {
            padding: 0.4rem 0.75rem;
            background: #e8ecf2;
            color: #1f3d63;
            border: 1px solid rgba(59, 108, 170, 0.2);
        }

        .toolbar button.active {
            background: var(--primary);
            color: white;
        }

        .content {
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: 180px;
            padding: 1rem;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.9);
        }

        .content:focus {
            outline: 2px solid rgba(59, 108, 170, 0.4);
        }

        .stats {
            font-size: 0.9rem;
            color: #4a4a4a;
            display: flex;
            gap: 1rem;
        }

        #export-area {
            margin-top: 2.5rem;
            display: grid;
            gap: 1rem;
        }

        #exported-text {
            width: 100%;
            min-height: 160px;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            resize: vertical;
        }

        @media (max-width: 780px) {
            main {
                padding: 1.5rem;
            }

            .block-header {
                grid-template-columns: 1fr;
            }

            .drag-handle {
                order: -1;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>Editor di Testo a Blocchi</h1>
    <p>Organizza il tuo testo in sezioni indipendenti, applica la formattazione che preferisci e genera in qualsiasi momento la versione combinata del tuo lavoro.</p>
</header>
<main>
    <div id="controls">
        <button id="add-block">➕ Aggiungi sezione</button>
        <button id="export">⬇️ Esporta testo</button>
        <button id="copy" disabled>📋 Copia testo esportato</button>
    </div>
    <div id="blocks" aria-live="polite"></div>
    <section id="export-area">
        <h2>Testo esportato</h2>
        <textarea id="exported-text" placeholder="Il testo combinato delle sezioni apparirà qui." readonly></textarea>
    </section>
</main>
<script>
    const blocksContainer = document.getElementById('blocks');
    const addBlockButton = document.getElementById('add-block');
    const exportButton = document.getElementById('export');
    const copyButton = document.getElementById('copy');
    const exportTextarea = document.getElementById('exported-text');

    let activeContent = null;

    function createBlock() {
        const block = document.createElement('article');
        block.className = 'block';
        block.setAttribute('draggable', 'true');

        block.innerHTML = `
            <div class="block-header">
                <span class="drag-handle" title="Trascina per riordinare" aria-hidden="true">☰</span>
                <input type="text" class="block-title" placeholder="Titolo della sezione">
                <input type="text" class="block-description" placeholder="Descrizione breve">
                <button class="delete">🗑️ Rimuovi</button>
            </div>
            <div class="toolbar" role="toolbar">
                <button type="button" data-command="bold"><strong>B</strong></button>
                <button type="button" data-command="italic"><em>I</em></button>
                <button type="button" data-command="underline"><u>U</u></button>
                <button type="button" data-command="justifyLeft">↤</button>
                <button type="button" data-command="justifyCenter">⤳</button>
                <button type="button" data-command="justifyRight">↦</button>
                <button type="button" data-command="justifyFull">⇆</button>
                <button type="button" data-command="undo">↺</button>
                <button type="button" data-command="redo">↻</button>
            </div>
            <div class="content" contenteditable="true" aria-label="Contenuto della sezione"></div>
            <div class="stats" aria-live="polite">
                <span class="words">Parole: 0</span>
                <span class="chars">Battute: 0</span>
            </div>
        `;

        const content = block.querySelector('.content');
        const wordsLabel = block.querySelector('.words');
        const charsLabel = block.querySelector('.chars');

        content.addEventListener('focus', () => {
            activeContent = content;
        });

        content.addEventListener('blur', () => {
            if (activeContent === content) {
                activeContent = null;
            }
        });

        content.addEventListener('input', () => {
            updateStats(content, wordsLabel, charsLabel);
        });

        block.querySelector('.delete').addEventListener('click', () => {
            block.remove();
        });

        addDragAndDropHandlers(block);

        return block;
    }

    function updateStats(content, wordsLabel, charsLabel) {
        const text = content.textContent || '';
        const trimmed = text.trim();
        const words = trimmed === '' ? 0 : trimmed.split(/\s+/).length;
        const chars = text.replace(/\n/g, '').length;
        wordsLabel.textContent = `Parole: ${words}`;
        charsLabel.textContent = `Battute: ${chars}`;
    }

    addBlockButton.addEventListener('click', () => {
        const newBlock = createBlock();
        blocksContainer.appendChild(newBlock);
        const content = newBlock.querySelector('.content');
        content.focus();
    });

    blocksContainer.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-command]');
        if (!button) return;

        const command = button.dataset.command;
        const block = button.closest('.block');
        const content = block.querySelector('.content');
        content.focus();

        if (['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'].includes(command)) {
            document.execCommand(command, false, null);
        } else if (command === 'undo' || command === 'redo') {
            document.execCommand(command);
        } else {
            document.execCommand(command, false, null);
        }
    });

    exportButton.addEventListener('click', () => {
        const blocks = Array.from(blocksContainer.querySelectorAll('.block'));
        const combined = blocks.map((block, index) => {
            const title = block.querySelector('.block-title').value.trim();
            const description = block.querySelector('.block-description').value.trim();
            const text = block.querySelector('.content').innerText.trim();
            const sectionParts = [];

            if (title) {
                sectionParts.push(`${title}`);
            } else {
                sectionParts.push(`Sezione ${index + 1}`);
            }

            if (description) {
                sectionParts.push(description);
            }

            if (text) {
                sectionParts.push(text);
            }

            return sectionParts.join('\n');
        }).join('\n\n');

        exportTextarea.value = combined;
        copyButton.disabled = combined.length === 0;
        exportTextarea.focus();
        exportTextarea.select();
    });

    copyButton.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(exportTextarea.value);
            copyButton.textContent = '✅ Copiato';
            setTimeout(() => {
                copyButton.textContent = '📋 Copia testo esportato';
            }, 2000);
        } catch (error) {
            copyButton.textContent = 'Impossibile copiare';
            setTimeout(() => {
                copyButton.textContent = '📋 Copia testo esportato';
            }, 2000);
        }
    });

    function addDragAndDropHandlers(block) {
        block.addEventListener('dragstart', (event) => {
            block.setAttribute('aria-grabbed', 'true');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', '');
            block.classList.add('dragging');
        });

        block.addEventListener('dragend', () => {
            block.removeAttribute('aria-grabbed');
            block.classList.remove('dragging');
        });
    }

    blocksContainer.addEventListener('dragover', (event) => {
        event.preventDefault();
        const dragging = blocksContainer.querySelector('.dragging');
        if (!dragging) return;

        const afterElement = getDragAfterElement(event.clientY);
        if (afterElement == null) {
            blocksContainer.appendChild(dragging);
        } else if (afterElement !== dragging) {
            blocksContainer.insertBefore(dragging, afterElement);
        }
    });

    function getDragAfterElement(y) {
        const draggableElements = [...blocksContainer.querySelectorAll('.block:not(.dragging)')];

        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Crea una sezione iniziale
    blocksContainer.appendChild(createBlock());
</script>
</body>
</html>
